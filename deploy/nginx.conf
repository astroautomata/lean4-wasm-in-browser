server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    gzip off;

    add_header X-Content-Type-Options "nosniff" always;

    location = /lean4game {
        return 301 /lean4game/;
    }

    location /lean4game/ {
        try_files $uri $uri/ =404;
        expires 1h;
    }

    location ^~ /lean4game/assets/ {
        try_files $uri =404;
        expires 1y;
    }

    location ~* \.wasm$ {
        types {
            application/wasm wasm;
        }
        try_files $uri =404;
        expires 1h;
    }

    location = /index.html {
        expires -1;
    }

    # The game client owns real URLs now, none of which exist as files. Serve
    # the game shell for those rather than the landing page; its asset
    # references are absolute, so the same document works from any path.
    # GitHub Pages does the same job through 404.html.
    location ^~ /visualNNG {
        try_files $uri /lean4game/index.html;
        expires -1;
    }

    location ^~ /classicNNG {
        try_files $uri /lean4game/index.html;
        expires -1;
    }

    location ^~ /pitch {
        try_files $uri /lean4game/index.html;
        expires -1;
    }

    location ^~ /g/ {
        try_files $uri /lean4game/index.html;
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
