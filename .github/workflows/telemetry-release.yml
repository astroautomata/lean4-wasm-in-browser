name: Telemetry collector release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - telemetry/**
      - .github/workflows/telemetry-release.yml

permissions:
  contents: read
  packages: write

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: lean_telemetry
          POSTGRES_USER: lean_telemetry
          POSTGRES_PASSWORD: integration-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lean_telemetry -d lean_telemetry"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: telemetry/package-lock.json
      - name: Test collector
        working-directory: telemetry
        run: npm ci && npm test
      - name: Test migrations and event storage against PostgreSQL
        working-directory: telemetry
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGDATABASE: lean_telemetry
          PGUSER: lean_telemetry
          PGPASSWORD: integration-test-password
          ALLOWED_ORIGINS: https://leangame.autumnofautumn.com
          PORT: 8090
        run: |
          set -euo pipefail
          node src/server.js &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 20); do
            curl --fail --silent http://127.0.0.1:8090/healthz >/dev/null && break
            sleep 1
          done
          curl --fail --silent --output /dev/null \
            --header 'Origin: https://leangame.autumnofautumn.com' \
            --header 'Content-Type: application/json' \
            --data '{"events":[{"event_id":"d707e185-136e-4f54-bca8-e1aaffbbe396","user_uuid":"a4ac71f1-54c6-40df-89f7-b5062bf71d60","attempt_uuid":"505300ff-0847-48eb-994b-7e834f938c4e","event_type":"proof_step","game_id":"g/local/NNG4","world_id":"Tutorial","level_id":2,"mode":"visual","sequence":1,"elapsed_ms":1234,"ts":"2026-08-04T12:00:00.000Z","step_type":"command","command":"rw [add_zero]","platform":{"browser":"chrome","device":"desktop"}}]}' \
            http://127.0.0.1:8090/v1/events
          node --input-type=module -e "import pg from 'pg'; const p=new pg.Pool(); const r=await p.query('select count(*)::int as count from proof_steps'); if(r.rows[0].count!==1) process.exit(1); const a=await p.query('select attributes->\'platform\'->>\'browser\' as browser, attributes->\'platform\'->>\'device\' as device from proof_attempts'); if(a.rows[0].browser!=='chrome'||a.rows[0].device!=='desktop') process.exit(1); await p.end()"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}-telemetry
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: telemetry
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=telemetry
          cache-to: type=gha,scope=telemetry,mode=max
          provenance: true
