name: playground tests

# Boot the exact browser-release compiler headlessly and check representative
# Lean programs. The release artifact supplies matching executable IR beside
# its oleans, avoiding drift from a separately maintained fixture.

on:
  workflow_run:
    workflows: ["Browser game Docker release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      release_run_id:
        description: Completed Browser game Docker release run ID
        required: true
        type: string

concurrency:
  group: playground-tests
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  test:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Match the Node version used to link and probe this large runtime.
          node-version: 25.9.0

      - name: Download the validated browser runtime
        uses: actions/download-artifact@v4
        with:
          pattern: visual-lean-libs-*
          merge-multiple: true
          path: browser-runtime
          run-id: ${{ github.event.workflow_run.id || inputs.release_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble the headless compiler fixture
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tests/.artifacts
          mkdir -p tests/.artifacts/bin tests/.artifacts/lib/lean
          cp browser-runtime/runtime/lean.js browser-runtime/runtime/lean.wasm tests/.artifacts/bin/
          tar -xzf browser-runtime/modules/game-modules.tar.gz -C tests/.artifacts/lib/lean
          test -s tests/.artifacts/lib/lean/Init.olean
          test "$(find tests/.artifacts/lib/lean -type f -name '*.ir' | wc -l)" -gt 0

      # No npm install is needed: these tests use Node built-ins only.
      - name: Run compiler integration tests
        run: node --stack-size=8192 --test tests/*.test.mjs
