name: Browser game Docker release
run-name: Build canonical browser game image

on:
  workflow_dispatch:
    inputs:
      lean4game_ref:
        description: lean4game branch, tag, or SHA
        required: false
        default: main
        type: string
      nng4_ref:
        description: NNG4 branch, tag, or SHA
        required: false
        default: main
        type: string
      visualtest_ref:
        description: VisualTest branch, tag, or SHA
        required: false
        default: main
        type: string
  push:
    branches:
      - main
    tags:
      - "v*"

concurrency:
  group: browser-docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-runtime:
    name: Build single-thread Lean WASM module artifact
    uses: ryyanmapes/lean4game/.github/workflows/build-browser-lean-libs.yml@main
    with:
      lean4game_ref: ${{ inputs.lean4game_ref || 'main' }}
      nng4_ref: ${{ inputs.nng4_ref || 'main' }}
      visualtest_ref: ${{ inputs.visualtest_ref || 'main' }}
      include_nng4: true
    secrets:
      CAULI_ARTIFACT_TOKEN: ${{ secrets.CAULI_ARTIFACT_TOKEN }}

  docker:
    name: Assemble, validate, and publish browser game
    needs: browser-runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out release shell
        uses: actions/checkout@v4
        with:
          path: lean4.js
      - name: Check out Lean4Game client
        uses: actions/checkout@v4
        with:
          repository: ryyanmapes/lean4game
          ref: ${{ inputs.lean4game_ref || 'main' }}
          path: Lean4Game/lean4game
      - name: Check out NNG4
        uses: actions/checkout@v4
        with:
          repository: ryyanmapes/NNG4
          ref: ${{ inputs.nng4_ref || 'main' }}
          path: Lean4Game/NNG4
      - name: Check out VisualTest
        uses: actions/checkout@v4
        with:
          repository: ryyanmapes/VisualTest
          ref: ${{ inputs.visualtest_ref || 'main' }}
          path: Lean4Game/VisualTest
      - name: Download canonical Lean WASM runtime and modules
        uses: actions/download-artifact@v4
        with:
          pattern: visual-lean-libs-*
          merge-multiple: true
          path: visual-lean-artifact
      - name: Verify canonical runtime artifact
        run: |
          test -s visual-lean-artifact/runtime/lean.js
          test -s visual-lean-artifact/runtime/lean.wasm
          test -s visual-lean-artifact/modules/game-modules.tar.gz
          test -s visual-lean-artifact/gamedata/NNG4/game.json
          test -s visual-lean-artifact/gamedata/VisualTest/game.json
          ! grep -q 'PThread' visual-lean-artifact/runtime/lean.js
          du -sh visual-lean-artifact
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
            type=ref,event=tag
          labels: |
            org.opencontainers.image.title=The Natural Numbers Game
            org.opencontainers.image.description=Browser-local NNG4 and Visual Lean, formally checked by Lean WASM
      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: lean4.js/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
      - name: Smoke-test the published image
        shell: bash
        env:
          IMAGE: ghcr.io/${{ github.repository }}:latest
        run: |
          set -euo pipefail
          docker pull "$IMAGE"
          docker run --detach --name lean4-wasm-release-smoke --publish 8080:80 "$IMAGE"
          cleanup() { docker rm --force lean4-wasm-release-smoke >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8080/ >/dev/null && break
            if [[ "$attempt" == 30 ]]; then docker logs lean4-wasm-release-smoke; exit 1; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8080/lean4game/index.html >/dev/null
          curl --fail --silent http://127.0.0.1:8080/lean4game/data/g/local/NNG4/game.json >/dev/null
          curl --fail --silent http://127.0.0.1:8080/lean4game/data/g/local/VisualTest/game.json >/dev/null
          curl --fail --silent http://127.0.0.1:8080/visual-lean/modules/game-modules.tar.gz >/dev/null
          if curl --silent --head http://127.0.0.1:8080/ | grep --ignore-case -q '^Cross-Origin-'; then
            echo '::error::The canonical single-thread site unexpectedly requires cross-origin isolation.'
            exit 1
          fi
      - name: Release summary
        run: |
          {
            echo '### Published canonical container'
            echo
            echo 'Single-threaded Lean WASM, reduced dynamic module loading, and no cross-origin isolation requirement.'
            echo
            echo '```'
            echo '${{ steps.meta.outputs.tags }}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  release-validation:
    name: Validate release UI and all Visual NNG levels
    needs: docker
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out Lean4Game client
        uses: actions/checkout@v4
        with:
          repository: ryyanmapes/lean4game
          ref: ${{ inputs.lean4game_ref || 'main' }}
          path: Lean4Game/lean4game
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node for the release gate
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Lean4Game/lean4game/package-lock.json
      - name: Install release-gate dependencies
        working-directory: Lean4Game/lean4game
        run: |
          npm ci
          npm install --no-save --package-lock=false --legacy-peer-deps puppeteer-core@24
      - name: Validate the release through browser player interactions
        working-directory: Lean4Game/lean4game
        env:
          IMAGE: ghcr.io/${{ github.repository }}:latest
          VISUAL_TIMEOUT: 600000
          EXPECT_CROSS_ORIGIN_ISOLATED: 'false'
        run: |
          set -euo pipefail
          cleanup() { docker rm --force canonical-release-validation >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          export CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_PATH"
          docker run --detach --name canonical-release-validation --publish 8083:80 "$IMAGE"
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8083/ >/dev/null && break
            sleep 1
          done
          node scripts/run-cypress.cjs run \
            --browser "$CHROME_PATH" \
            --spec "cypress/e2e/nng4-classic-diagnostics.cy.ts,cypress/e2e/nng4-classic-mode-persistence.cy.ts,cypress/e2e/nng4-implication-and-display-regressions.cy.ts,cypress/e2e/nng4-release-routes.cy.ts,cypress/e2e/nng4-visual-complete-playthrough.cy.ts,cypress/e2e/telemetry-loading-consent.cy.ts,cypress/e2e/visual-loading-and-implication-guides.cy.ts,cypress/e2e/visual-mobile-pagination-stability.cy.ts,cypress/e2e/visualtest-local-wasm-smoke.cy.ts,cypress/e2e/visual-wasm-worker-diagnostic.cy.ts" \
            --config baseUrl=http://127.0.0.1:8083 \
            --env VISUAL_TIMEOUT=600000,LEAN4GAME_MOUNT=/lean4game/index.html
      - name: Upload release validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-release-validation-${{ github.run_id }}
          path: |
            Lean4Game/lean4game/cypress/results/*.json
            Lean4Game/lean4game/cypress/screenshots/**
          if-no-files-found: warn
          retention-days: 14

  pages:
    name: Publish the smoke-tested image to GitHub Pages
    # Never publish merely because the image assembled. The browser-player
    # suite above verifies the exact container that Pages will extract.
    needs: [docker, release-validation]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract the validated static site
        env:
          IMAGE: ghcr.io/${{ github.repository }}:latest
        run: |
          set -euo pipefail
          docker pull "$IMAGE"
          container="$(docker create "$IMAGE")"
          cleanup() { docker rm --force "$container" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          mkdir -p _site
          docker cp "$container:/usr/share/nginx/html/." _site/
          test -s _site/index.html
          test -s _site/lean4game/index.html
          test -s _site/visual-lean/runtime/lean.wasm
          test -s _site/visual-lean/modules/game-modules.tar.gz
          ! test -e _site/visual-lean/snapshots/game.snap.gz
          touch _site/.nojekyll
          printf '%s\n' 'leangame.autumnofautumn.com' > _site/CNAME

          site_bytes="$(du -sb _site | cut -f1)"
          if (( site_bytes >= 1073741824 )); then
            echo "::error::GitHub Pages site is $site_bytes bytes, exceeding the supported 1 GiB limit."
            exit 1
          fi
          {
            echo '### GitHub Pages payload'
            echo
            printf 'Total static size: **%.1f MiB** (%s bytes)\n\n' "$((site_bytes / 1048576))" "$site_bytes"
            echo 'Largest files:'
            echo '```'
            find _site -type f -printf '%s %p\n' | sort -nr > largest-files.txt
            head -10 largest-files.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
