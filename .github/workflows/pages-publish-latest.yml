name: Publish latest browser image to GitHub Pages

on:
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pages:
    name: Publish latest image to GitHub Pages
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the release scripts
        uses: actions/checkout@v4
        with:
          path: lean4.js
          sparse-checkout: scripts

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract the latest static site
        env:
          IMAGE: ghcr.io/${{ github.repository }}:latest
        run: |
          set -euo pipefail
          docker pull "$IMAGE"
          container="$(docker create "$IMAGE")"
          cleanup() { docker rm --force "$container" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          mkdir -p _site
          docker cp "$container:/usr/share/nginx/html/." _site/
          test -s _site/index.html
          test -s _site/lean4game/index.html
          test -s _site/visual-lean/runtime/lean.wasm
          test -s _site/visual-lean/modules/game-modules.tar.gz
          ! test -e _site/visual-lean/snapshots/game.snap.gz
          touch _site/.nojekyll
          printf '%s\n' 'leangame.autumnofautumn.com' > _site/CNAME

          site_bytes="$(du -sb _site | cut -f1)"
          if (( site_bytes >= 1073741824 )); then
            echo "::error::GitHub Pages site is $site_bytes bytes, exceeding the supported 1 GiB limit."
            exit 1
          fi

      # Off (a no-op) until the R2_PUBLIC_BASE repository secret is set.
      # A failed upload or check stops the deploy.
      - name: Publish Lean assets to R2
        env:
          R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: bash lean4.js/scripts/publish-r2-assets.sh _site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
